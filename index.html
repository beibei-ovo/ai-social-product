<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f4">
  <meta name="description" content="Backstory — real experiences worth asking about. An interactive product demo.">
  <title>Backstory — What happened next?</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf8f4;
      --white: #fffefa;
      --ink: #26203a;

      --sans: 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #eae4dc; font: 15px/1.45 var(--sans); }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid #8962d6; outline-offset: 3px; }
    a { color: var(--purple-ink); }
    h1, h2, h3, p, figure { margin: 0; }
    h1, h2, h3 { line-height: 1.12; }
    ul { margin: 0; padding: 0; list-style: none; }
    svg { display: block; flex: none; }
    .layout { display: grid; grid-template-columns: minmax(240px, 350px) minmax(0, 430px); gap: clamp(45px, 7vw, 105px); justify-content: center; align-items: center; padding: 25px 36px; min-height: 100dvh; }
    .desk { padding-bottom: 30px; }
    .desk .wordmark { margin-bottom: 56px; }
    .desk h1 { font: 400 clamp(48px, 6vw, 75px)/.99 var(--serif); letter-spacing: -.068em; margin: 12px 0 21px; }
    .desk h1 em { color: var(--purple-ink); font-weight: 400; }
    .desk p { color: var(--muted); max-width: 29ch; line-height: 1.55; }
    .desk ol { padding: 0; margin: 35px 0 18px; list-style: none; display: grid; gap: 0; }
    .desk ol li { border-top: 1px solid #d8cec5; padding: 10px 0; }

    .desk-note { font-size: 12px; }
    .shell { height: min(880px, calc(100dvh - 50px)); min-height: 570px; border-radius: 31px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; position: relative; overflow: hidden; isolation: isolate; background: var(--paper); box-shadow: 0 24px 66px #2a1d3027, 0 0 0 1px #30244216; }

    .wordmark { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); font-weight: 750; font-size: 21px; letter-spacing: -.07em; }
    .brand-icon { width: 29px; height: 29px; background: var(--violet); border-radius: 9px; color: white; display: grid; place-items: center; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex: none; }

    .avatar { display: inline-grid; place-items: center; flex: none; width: 31px; height: 31px; border-radius: 50%; background: var(--avatar-bg, #e9dff8); color: var(--avatar-ink, #462779); font-weight: 800; font-size: 12px; }
    .avatar.tiny { width: 23px; height: 23px; font-size: 10px; }
    .scroll { overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #d8cedc transparent; }
    .page { padding: 22px 19px 27px; }
    .eyebrow { font-size: 10px; font-weight: 800; line-height: 1.25; text-transform: uppercase; letter-spacing: .14em; color: var(--purple-ink); }
    .page-title { font: 400 34px/1.04 var(--serif); letter-spacing: -.05em; margin: 7px 0 9px; }

    .muted { color: var(--muted); }
    .space { margin-top: 18px; }
    .hero { background: #ece4f9; border: 1px solid #e2d6f4; border-radius: 21px; padding: 16px 14px 14px; position: relative; overflow: hidden; }
    .hero h1 { font: 400 34px/.99 var(--serif); letter-spacing: -.055em; margin: 7px 0 10px; max-width: 10ch; }

    .composer { display: flex; align-items: center; gap: 8px; padding: 5px 5px 5px 12px; min-height: 48px; background: #f0ede9; border: 1px solid transparent; border-radius: 28px; }
    .composer:focus-within { border-color: #a88dd9; box-shadow: 0 0 0 3px #ede4fa; }
    .search-form { margin-top: 14px; background: #fffcff; box-shadow: 0 3px 10px #67459614; }
    .composer input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); padding: 5px 0; font-size: 16px; outline: none; }
    .composer input:focus-visible { outline: none; }

    .composer .send:hover { transform: translateY(-1px); }
    .icon-button { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 0; background: var(--violet); color: white; flex: none; }
    .section { margin-top: 20px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .section-head h2 { font-size: 15px; letter-spacing: -.024em; }
    .section-head .subtle { font-size: 11px; }
    .topics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .topic { border: 1px solid var(--line); background: var(--white); border-radius: 10px; display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 5px 7px; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .topic svg { color: var(--purple-ink); }
    .topic:hover, .ghost:hover, .row-button:hover, .story-link:hover { background: #f0e9fa; }
    .story-card { display: block; width: 100%; text-align: left; padding: 0; overflow: hidden; background: var(--white); border: 1px solid var(--line); border-radius: 16px; }
    .story-card:hover { border-color: #ad92d9; }
    .story-list { display: grid; gap: 8px; }
    .story-cover { width: 100%; height: 107px; background: #efd5a8; overflow: hidden; }
    .story-cover svg { width: 100%; height: 100%; }
    .card-body { padding: 12px 13px; }
    .card-body h3 { font: 400 22px/1.13 var(--serif); letter-spacing: -.033em; margin: 4px 0 8px; }
    .byline { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .byline strong { color: var(--ink); font-weight: 700; }
    .byline .trailing { margin-left: auto; color: var(--purple-ink); }
    .compact-card { display: grid; grid-template-columns: 43px minmax(0, 1fr) 16px; align-items: start; gap: 10px; padding: 12px; }
    .compact-card h3 { font-size: 15px; line-height: 1.27; margin: 4px 0 7px; }
    .compact-card > svg { align-self: center; color: var(--purple-ink); }
    .post-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 11px; }
    .tile-icon { display: grid; place-items: center; border-radius: 10px; width: 43px; height: 43px; background: var(--tile, var(--lavender)); color: var(--purple-ink); flex: none; }
    .bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--white); padding: 4px 7px max(6px, env(safe-area-inset-bottom)); z-index: 2; }
    .nav-button { position: relative; min-width: 0; min-height: 46px; display: grid; justify-items: center; align-content: center; gap: 2px; color: var(--muted); border: 0; border-radius: 10px; background: transparent; font-size: 10px; font-weight: 650; }
    .nav-button[aria-current="page"] { color: var(--purple-ink); background: #f0e9fa; }
    .nav-dot { position: absolute; top: 4px; left: calc(50% + 9px); width: 8px; height: 8px; border: 1px solid white; background: #b34668; border-radius: 50%; }
    .back, .text-button { display: inline-flex; align-items: center; gap: 5px; padding: 4px 0; min-height: 32px; background: none; border: 0; color: var(--purple-ink); font-weight: 700; text-align: left; }
    .topbar .back { padding: 0; }
    .button-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .primary, .ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 750; }
    .primary { border: 1px solid var(--violet); background: var(--violet); color: white; }
    .primary:hover, .icon-button:hover { background: #492992; }
    .ghost { border: 1px solid var(--line); background: var(--white); color: var(--purple-ink); }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px; background: var(--lavender); color: var(--purple-ink); font-size: 11px; font-weight: 700; }
    .pill.pending { background: #f9e9ca; color: #704916; }
    .pill.human { background: #e1efe2; color: #255436; }
    .panel, .message, .match, .empty { border: 1px solid var(--line); border-radius: 13px; background: var(--white); padding: 13px; }
    .panel h2, .match h3 { font-size: 15px; margin-bottom: 6px; }
    .match + .match, .message + .message { margin-top: 8px; }
    .match { display: grid; gap: 7px; }
    .match p { font-size: 13px; color: var(--muted); }
    .story-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; padding: 8px 9px; border-radius: 8px; border: 1px solid var(--line); background: #fbf9fc; color: var(--purple-ink); font-size: 12px; font-weight: 700; }
    .story-copy { margin: 12px 0; }
    .story-copy .page-title { font-size: 36px; }
    .story-quote { font: 400 22px/1.22 var(--serif); letter-spacing: -.025em; margin: 13px 0; }
    .story-page .story-cover { height: 134px; border-radius: 13px; margin: 12px 0; }
    .audio-row { display: flex; align-items: center; gap: 8px; background: var(--lavender); border-radius: 11px; padding: 8px; margin: 10px 0; }
    .audio-row button { width: 34px; height: 34px; }
    .audio-row .audio-caption { display: grid; gap: 0; min-width: 0; }
    .audio-caption strong { font-size: 12px; }
    .audio-caption span { font-size: 11px; color: var(--muted); }
    .audio-row .wave { margin-left: auto; color: #7652bb; max-width: 38%; }
    details { border-bottom: 1px solid var(--line); padding: 4px 0 10px; }
    summary { width: fit-content; min-height: 29px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--purple-ink); }
    .transcript { display: grid; gap: 7px; margin-top: 5px; }
    .transcript p { font-size: 13px; color: var(--muted); }
    .ask-section { display: grid; gap: 8px; margin-top: 20px; }
    .story-tabs { display: flex; gap: 19px; border-bottom: 1px solid var(--line); margin-top: 17px; }
    .story-tab { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); min-height: 43px; padding: 0 1px; font-size: 13px; font-weight: 700; }
    .story-tab[aria-pressed="true"] { border-color: var(--violet); color: var(--ink); }
    .tab-count { font-size: 11px; background: #eee7f6; border-radius: 10px; min-width: 19px; text-align: center; padding-inline: 4px; color: var(--purple-ink); }
    .discussion { display: grid; gap: 12px; padding-top: 12px; }
    .discussion-list { display: grid; gap: 11px; }
    .comment { display: grid; grid-template-columns: 31px minmax(0, 1fr); gap: 8px; align-items: start; }
    .comment-content { min-width: 0; }
    .comment-content p { margin-top: 5px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .comment-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; }
    .comment-time { color: var(--muted); font-size: 11px; }
    .comment-replies { display: grid; gap: 8px; border-left: 1px solid #dfd4e7; margin-top: 9px; padding-left: 8px; }
    .comment.twin { background: #f1ebf9; border-radius: 12px; padding: 8px; grid-template-columns: 25px minmax(0, 1fr); }
    .twin-avatar { display: inline-grid; place-items: center; width: 25px; height: 25px; border-radius: 8px; background: #e4d7f8; color: var(--purple-ink); }
    .kind { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; font-size: 10px; line-height: 1.35; font-weight: 750; white-space: nowrap; }
    .kind.human { background: #e6eee3; color: #315743; }
    .kind.ai { background: #e8ddf9; color: var(--purple-ink); }
    .comment-source { margin-top: 3px; min-height: 28px; font-size: 11px; }
    .prompt-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .prompt-list button { min-height: 31px; padding: 4px 8px; font-size: 11px; }
    .ask-form { margin-top: 3px; }
    .message h3 { font-size: 14px; margin: 4px 0 7px; }
    .message p { margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message .button-row { margin-top: 10px; }
    .message .source { display: block; border: 0; background: var(--lavender); color: var(--purple-ink); padding: 6px 8px; border-radius: 7px; margin-top: 6px; font-size: 12px; text-align: left; }
    .source-text { background: #f2edf9; border-radius: 7px; padding: 7px; font-size: 12px; }
    .row-button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px; text-align: left; background: var(--white); border: 1px solid var(--line); border-radius: 10px; }
    .row-button .row-copy { flex: 1; min-width: 0; }
    .row-copy strong { display: block; overflow-wrap: anywhere; font-size: 13px; }
    .row-button .arrow { color: var(--purple-ink); }
    .row-list { display: grid; gap: 6px; }
    .form-stack { display: grid; gap: 12px; }
    .field { display: grid; gap: 5px; font-size: 13px; font-weight: 700; }
    .field input, .field select, .field textarea { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--white); color: var(--ink); padding: 9px; font-size: 16px; font-weight: 400; }
    textarea { min-height: 92px; resize: vertical; }
    .writing-panel { padding: 13px 15px; display: grid; gap: 8px; border-radius: 18px; background: var(--white); border: 1px solid #ece6ec; box-shadow: 0 4px 15px #31204408; }
    .writing-panel .field { color: var(--muted); }
    .writing-panel .field input, .writing-panel .field textarea { padding: 2px 0 7px; border: 0; background: transparent; border-radius: 0; }
    .writing-panel .field input { font-family: var(--serif); font-size: 22px; letter-spacing: -.025em; border-bottom: 1px solid var(--line); }
    .writing-panel .field textarea { padding-top: 3px; min-height: 120px; line-height: 1.55; }
    .writing-panel .field input::placeholder, .writing-panel .field textarea::placeholder { color: #766d7e; }
    .writing-toolbar { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; padding-top: 9px; border-top: 1px solid var(--line); }
    .writing-toolbar .field { display: flex; align-items: center; gap: 5px; }
    .writing-toolbar .field select { width: auto; max-width: 100%; border: 0; border-radius: 99px; background: var(--lavender); color: var(--purple-ink); font-weight: 650; font-size: 12px; padding: 6px 8px; }

    dialog { color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 17px; width: min(390px, calc(100% - 24px)); max-height: 83dvh; padding: 16px; box-shadow: 0 15px 50px #25193440; }

    .dialog-head h2 { font: 400 25px/1.1 var(--serif); letter-spacing: -.035em; }

      .page { padding-inline: 12px; }
      .hero-decoration { right: -9px; width: 94px; }

  </style>

<body>
  <div class="layout">
    <aside class="desk" aria-label="Demo guide">
      <a class="wordmark" href="#explore" data-action="explore"><span class="brand-icon" data-icon="brand"></span>Backstory</a>
      <div class="eyebrow">A social app for the curious</div>
      <h1>Get the story<br><em>behind the story.</em></h1>
      <p>Real experiences are worth a follow-up. Find a story, hear it in the author’s words, and ask what happened next.</p>
      <ol>
        <li><button data-action="try-match"><span class="step-no">01</span> Find a circle by asking a question</button></li>
        <li><button data-action="open-story" data-id="solo"><span class="step-no">02</span> Ask about Maya’s story</button></li>
        <li><button data-action="demo"><span class="step-no">03</span> Switch roles to answer as Maya</button></li>
      </ol>
      <p class="desk-note">Interactive demo · Sample stories · Local simulation</p>
    </aside>
    <section class="shell" aria-label="Backstory mobile app">
      <header class="topbar" id="topbar"></header>
      <main class="scroll" id="screen" tabindex="-1"></main>
      <nav class="bottom-nav" id="navigation" aria-label="Main navigation"></nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <script>
    'use strict';

    const icons = {
      brand: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5.4 4 .9-4.3A2.5 2.5 0 0 1 4 13.5z"/><path d="M8 8h8m-8 4h5"/>',
      compass: '<circle cx="12" cy="12" r="9"/><path d="m15.6 8.4-1.9 5.3-5.3 1.9 1.9-5.3z"/>',
      plus: '<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8m-4-4v8"/>',
      inbox: '<path d="M5 4h14l2 10v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4z"/><path d="M3 14h5l2 2h4l2-2h5"/>',
      user: '<circle cx="12" cy="8" r="3"/><path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/>',
      sparkle: '<path d="M12 2.5 14.3 9.7l7.2 2.3-7.2 2.3-2.3 7.2-2.3-7.2-7.2-2.3 7.2-2.3z"/>',
      up: '<path d="M12 19V5m-5 5 5-5 5 5"/>',
      right: '<path d="m9 6 6 6-6 6"/>',
      back: '<path d="m15 6-6 6 6 6"/>',
      more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      play: '<path d="m8 5 12 7-12 7z" fill="currentColor" stroke="none"/>',
      pause: '<path d="M9 5v14m6-14v14" stroke-width="3"/>',
      game: '<path d="M7 7h10a4 4 0 0 1 4 3l1 4a3 3 0 0 1-5 3l-2-2H9l-2 2a3 3 0 0 1-5-3l1-4a4 4 0 0 1 4-3z"/><path d="M6 11v4m-2-2h4m7 0h.1m3-2h.1"/>',
      home: '<path d="M3 11 12 4l9 7M6 10v10h12V10m-8 10v-6h4v6"/>',
      travel: '<path d="m3 11 18-7-7 18-3-8-8-3zM11 14l5-5"/>',

      return String(value).toLowerCase().replace(/[’']/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();

      return normalize(value).split(' ').filter(word => word.length > 2 && !stopWords.has(word));

    function includesPhrase(text, phrase) {
      const normalized = normalize(phrase);
      if (/[\u3400-\u9fff]/u.test(normalized)) return text.includes(normalized);
      return ` ${text} `.includes(` ${normalized} `);
    }

    function matchCircles(question) {
      const text = normalize(question);
      return circles.map(circle => {
        const query = circle.id === 'work' ? text.replace(/\bafter work\b/g, '') : text;
        const score = circle.words.reduce((total, phrase) => {
          if (!includesPhrase(query, phrase)) return total;
          return total + (phrase.includes(' ') ? 3 : 2);
        }, 0);
        return { circle, score };
      }).filter(match => match.score > 0 && circleStories(match.circle.id).length > 0)
        .sort((left, right) => right.score - left.score).slice(0, 2).map(match => match.circle);
    }

    function pickSource(question, sources) {
      const query = normalize(question);
      const time = query.match(/\b(?:three|3|six|6|twelve|12) months?\b|\b(?:a|one|1|two|2) years?\b/);
      const words = new Set(tokens(question));
      let best = null;
      let bestScore = 0;
      for (const source of sources) {
        if (!source.enabled) continue;
        const text = normalize(source.text);
        if (time && !includesPhrase(text.replace(/\b3 months?\b/g, 'three months'), time[0].replace(/^3 months?$/, 'three months'))) continue;
        const direct = (source.keywords || []).filter(phrase => includesPhrase(query, phrase)).length;
        const shared = new Set(tokens(source.text).filter(word => words.has(word))).size;
        const score = direct * 4 + shared;
        if (score >= 2 && score > bestScore) {
          best = source;
          bestScore = score;
        }
      }
      return best;
    }

      const sourceIds = [];
      const unanswered = [];
      for (const part of parts) {
        const source = pickSource(part, story.sources);
        if (source && !sourceIds.includes(source.id)) sourceIds.push(source.id);
        if (!source) unanswered.push(part);

      return { id: makeId('chat'), question, sourceIds, unanswered, sentId: null };

        <section class="section" aria-labelledby="topics-title">
          <div class="section-head"><h2 id="topics-title">Browse topics</h2><span class="subtle">6 starting points</span></div>
          <div class="topics">${circles.map(circle => `<button class="topic" data-action="circle" data-id="${circle.id}">${icon(circle.icon, 14)}${circle.topic}</button>`).join('')}</div>
        </section>
        ${followed.length ? `<section class="section"><div class="section-head"><h2>Your circles</h2></div><div class="button-row">${followed.map(id => action('circle', escape(getCircle(id).title), id)).join('')}</div></section>` : ''}
        <section class="section" aria-labelledby="stories-title">
          <div class="section-head"><h2 id="stories-title">Stories to start with</h2>${action('try-match', 'Try an example', '', 'text-button subtle')}</div>
          <div class="story-list">${starter ? renderCard(starter, true) : '<div class="empty">Stories will appear here when published.</div>'}${otherStories.map(story => renderCard(story)).join('')}</div>
        </section>
      </div>`;
    }

    function renderSearch() {
      if (search.results === null && !search.clarify && !search.pending) return '';
      if (search.pending) return '<section class="section panel" role="status">Looking for relevant stories…</section>';
      if (search.clarify) return `<section class="section panel" id="search-results" aria-live="polite"><h2>What kind of experience do you want to hear about?</h2>
        <p class="subtle">Try adding a detail, or pick a topic below.</p></section>`;
      if (!search.results.length) return `<section class="section empty" id="search-results" aria-live="polite"><h2>No close match yet</h2><p>Try a different question or browse the topics below.</p></section>`;
      const matches = search.results.map(id => getCircle(id)).filter(circle => circleStories(circle.id).length);
      return `<section class="section" id="search-results" aria-live="polite">
        <div class="section-head"><h2>Circles for this question</h2><span class="pill">${icon('sparkle', 12)} Demo match</span></div>
        ${matches.map(circle => {
          const story = circleStories(circle.id).find(entry => entry.circleIds[0] === circle.id) || circleStories(circle.id)[0];
          return `<article class="match"><div class="eyebrow">${circle.topic}</div><h3>${escape(circle.title)}</h3><p>${escape(circle.reason)}</p>
            ${action('open-story', `${escape(story.title)} ${icon('right', 14)}`, story.id, 'story-link')}${action('circle', 'View circle', circle.id, 'text-button')}
          </article>`;
        }).join('') || '<div class="empty">Those stories are no longer available. Try browsing below.</div>'}
      </section>`;
    }

    function renderCircle() {
      const circle = getCircle(page.id);
      if (!circle) return renderUnavailable('Circle unavailable');
      const followed = (state.follows[state.role] || []).includes(circle.id);
      const stories = circleStories(circle.id);
      return `<div class="page">
        <div class="button-row">${circleIcon(circle)}<span class="eyebrow">${circle.topic} circle</span></div>
        <h1 class="page-title">${escape(circle.title)}</h1><p class="subtle">${escape(circle.reason)}</p>
        <div class="button-row space">${action('follow', followed ? `${icon('check', 15)} Following` : 'Follow circle', circle.id, followed ? 'ghost' : 'primary')}${action('share-circle', 'Share an experience', circle.id)}</div>
        <section class="section"><div class="section-head"><h2>Experiences</h2><span class="subtle">${stories.length} ${stories.length === 1 ? 'story' : 'stories'}</span></div>
        <div class="story-list">${stories.length ? stories.map(story => renderCard(story)).join('') : '<div class="empty">This circle is waiting for its first story.</div>'}</div></section>
      </div>`;
    }

    function renderUnavailable(title = 'Story unavailable') {
      return `<div class="page"><div class="empty"><h2>${title}</h2><p>This link is no longer available in this demo.</p><div class="space">${action('explore', 'Back to Explore')}</div></div></div>`;
    }

    function discussionFor(story) {
      const example = discussionExamples[story.id];
      const comments = state.comments.filter(comment => comment.storyId === story.id);
      const roots = [];
      if (example) {
        roots.push({
          id: `${story.id}-sample-comment`, author: example.commenter, text: example.prompt, time: '2h ago',
          replies: [
            { kind: 'twin', sourceId: example.source },
            { author: story.author, text: example.note, time: '1h ago' }
          ]
        });
      }
      for (const comment of comments) {
        if (!comment.parentId) roots.push({ ...comment, replies: [] });
      }
      for (const root of roots) {
        root.replies.push(...comments.filter(comment => comment.parentId === root.id));
      }
      return roots;
    }

    function renderComment(story, comment, root = false) {
      if (comment.kind === 'twin') {
        const source = story.sources.find(entry => entry.id === comment.sourceId && entry.enabled);
        return `<article class="comment twin" data-kind="twin">
          <span class="twin-avatar" aria-hidden="true">${icon('sparkle', 14)}</span>
          <div class="comment-content"><div class="comment-head"><strong>${people[story.author].first}’s AI twin</strong><span class="kind ai">AI reply</span></div>
            ${source ? `<p>“${escape(source.text)}”</p>${source.clip !== undefined ? action('play-source', `${icon('play', 12)} Hear the source`, source.id, 'text-button comment-source') : '<p class="subtle">From the author’s approved story</p>'}` : '<p class="subtle">Source access was withdrawn.</p>'}
          </div></article>`;
      }
      const person = people[comment.author];
      return `<article class="comment" data-kind="human">
        ${avatar(comment.author)}<div class="comment-content"><div class="comment-head"><strong>${person.name}</strong><span class="kind human">${comment.author === story.author ? 'Human · Author' : 'Human comment'}</span><span class="comment-time">${escape(comment.time || 'Just now')}</span></div>
        <p>${escape(comment.text)}</p>
        ${root ? action('comment-reply', 'Reply', comment.id, 'text-button comment-source') : ''}
        ${comment.replies?.length ? `<div class="comment-replies">${comment.replies.map(reply => renderComment(story, reply)).join('')}</div>` : ''}</div>
      </article>`;
    }

    function renderDiscussion(story, threads) {
      const parent = threads.find(thread => thread.id === commentParent);
      return `<section class="discussion" id="discussion" aria-label="Public discussion">
        ${threads.length ? `<div class="discussion-list">${threads.map(comment => renderComment(story, comment, true)).join('')}</div>` : '<p class="subtle">Be the first to share a thought.</p>'}
        ${state.role === 'guest' ? action('demo', 'Choose a demo identity to comment') : `<div>
          ${parent ? `<div class="button-row"><p class="subtle">Replying to ${people[parent.author].first}</p>${action('cancel-comment-reply', 'Cancel', '', 'text-button comment-source')}</div>` : ''}
          <form class="composer" id="comment-form">
            ${avatar(state.role, true)}<input name="comment" aria-label="Write a public comment" placeholder="${parent ? 'Write a public reply…' : 'Leave a public comment…'}" maxlength="500" required>
            <button class="icon-button send" type="submit" aria-label="Post comment">${icon('up', 17)}</button>
          </form>
        </div>`}
      </section>`;
    }

    function renderStory() {
      const story = getStory(page.id);
      if (!story) return renderUnavailable();
      const name = people[story.author].first;
      const circle = storyCircle(story);
      const audio = story.id === 'solo' || story.audio;
      const summary = story.summary || story.sources[0]?.text || '';
      const own = state.role === story.author;
      const linked = getStory(story.linked);
      const prompts = story.prompts?.length ? story.prompts : ['What happened next?'];
      const threads = discussionFor(story);
      const comments = threads.reduce((count, thread) => count + 1 + thread.replies.length, 0);
      return `<article class="page story-page">
        <div class="button-row"><button class="text-button eyebrow" data-action="circle" data-id="${circle.id}">${escape(circle.title)}</button>${own ? action('manage', 'Manage sources', story.id, 'text-button') : ''}</div>
        <div class="story-copy"><h1 class="page-title">${escape(story.title)}</h1><p class="subtle">${escape(summary)}</p></div>
        <div class="byline">${byline(story)}${storyKind()}<span class="trailing">${action('copy-link', `${icon('share', 14)} Share`, story.id, 'text-button')}</span></div>
        ${story.cover === 'room' ? `<div class="story-cover">${roomArt()}</div>` : ''}
        ${linked ? `<p class="subtle">In response to ${action('open-story', escape(linked.title), linked.id, 'text-button')}</p>` : ''}
        ${audio ? `<div class="audio-row">
          <button type="button" class="icon-button" data-action="play-story" data-id="${escape(story.id)}" aria-label="Play story">${icon('play', 16)}</button>
          <div class="audio-caption"><strong>${story.id === 'solo' ? 'Sample narration' : 'Story audio'}</strong><span>${story.id === 'solo' ? `${clock(sampleClipTimes.at(-1))} · Synthetic demo voice` : 'Recorded in the demo'}</span></div>${wave()}
        </div>` : ''}
        <details${audio ? '' : ' open'}><summary>${audio ? 'Read transcript' : 'Read story'}</summary><div class="transcript">
          ${story.sources.map(source => `<p>${source.addition ? '<strong>Author update · </strong>' : ''}${escape(source.text)}</p>`).join('')}
        </div></details>
        <div class="story-tabs" aria-label="Story interactions">
          <button class="story-tab" data-action="story-tab" data-id="discussion" aria-pressed="${storyTab === 'discussion'}">${icon('chat', 14)} Discussion <span class="tab-count">${comments}</span></button>
          <button class="story-tab" data-action="story-tab" data-id="ask" aria-pressed="${storyTab === 'ask'}">${icon('sparkle', 13)} Ask ${name}’s twin</button>
        </div>
        ${storyTab === 'discussion' ? renderDiscussion(story, threads) : `<section class="ask-section" aria-labelledby="ask-title">
          <div class="section-head"><h2 id="ask-title">Ask about this story</h2><span class="kind ai">AI twin</span></div>
          <p class="subtle">${name}’s twin can answer from the story ${name} approved.</p>
          <div class="prompt-list">${prompts.map(prompt => action('prompt', escape(prompt), '', 'ghost')).join('')}</div>
          <form class="composer ask-form" id="ask-form">
            <span class="twin-avatar" aria-hidden="true">${icon('sparkle', 14)}</span>
            <input name="question" aria-label="Ask about this story" placeholder="Ask your own question…" maxlength="320" value="${escape(askError?.question || '')}" required>
            <button class="icon-button send" type="submit" aria-label="Ask question">${icon('up', 17)}</button>
          </form>
          ${askError ? '<p class="error" role="alert">The demo answer failed. Your question is still here. Try again.</p>' : ''}
          <div id="story-messages" aria-live="polite">${messagesFor(story.id).map(message => renderAnswer(story, message, name)).join('')}</div>
        </section>`}
      </article>`;
    }

    function renderAnswer(story, message, name) {
      const sources = message.sourceIds.map(id => story.sources.find(source => source.id === id));
      const revoked = sources.some(source => !source?.enabled);
      const sent = message.sentId ? getQuestion(message.sentId) : null;
      let explanation = '';
      if (revoked) explanation = '<p class="subtle">Source access was withdrawn. Ask again to use the sources that are still available.</p>';
      else if (sources.length) explanation = sources.map(source => {
        const hasAudio = source.clip !== undefined || source.audio;
        const timestamp = source.clip !== undefined ? `${clock(sampleClipTimes[source.clip])}–${clock(sampleClipTimes[source.clip + 1])}` : '';
        return `<p class="source-text">“${escape(source.text)}”</p>${hasAudio ? action('play-source', `${icon('play', 13)} ${timestamp || 'Play author audio'}`, source.id, 'source button-row clip-time') : '<p class="subtle">Source · Author’s approved text</p>'}`;
      }).join('');
      const needsAuthor = message.unanswered.length > 0;
      const canSend = needsAuthor && state.role !== story.author && !sent;
      return `<article class="message" id="answer-${escape(message.id)}">
        <div class="button-row"><span class="kind ai">${name}’s AI twin</span><span class="subtle">${sources.length ? `AI · From ${name}’s story` : 'Beyond this story'}</span></div>
        <h3>${escape(message.question)}</h3>${explanation}
        ${needsAuthor ? `<p class="subtle">${sources.length ? 'The approved story doesn’t cover the rest of your question.' : 'The approved story doesn’t cover this question yet.'}</p>` : ''}
        ${canSend ? `<div class="button-row">${action('confirm-ask', `Ask ${name}`, message.id, 'primary')}</div>` : ''}
        ${sent ? `<div class="button-row"><span class="pill ${sent.status === 'answered' ? 'human' : 'pending'}">${sent.status === 'answered' ? `${name} replied` : sent.status === 'declined' ? 'Passed' : `Waiting for ${name}`}</span>${action('open-thread', 'Open conversation', sent.id, 'text-button')}</div>` : ''}
      </article>`;
    }

    function recordingControls(target, url) {
      const running = recording?.target === target;
      return `<div class="recording">
        <div class="button-row">${action(running ? 'stop-recording' : 'record', `${icon('mic', 15)} ${running ? 'Stop recording' : 'Record audio'}`, target)}${url ? action('remove-audio', 'Remove audio', target, 'text-button') : ''}</div>
        ${url ? `<audio controls preload="metadata" src="${escape(url)}" aria-label="Preview recording"></audio>` : ''}
        ${recordingMessage ? `<p class="subtle" role="status">${escape(recordingMessage)}</p>` : ''}
      </div>`;
    }

    function guestPrompt() {
      return `<div class="empty"><h2>You’re viewing as a guest</h2><p>Pick a demo identity to post, follow, or read a private conversation.</p><div class="space">${action('demo', 'Choose a demo identity', '', 'primary')}</div></div>`;
    }

    function renderShare() {
      if (state.role === 'guest') return `<div class="page">${guestPrompt()}</div>`;
      const draft = getDraft();
      const linked = getStory(draft.linked);
      return `<div class="page">
        <div class="eyebrow">Your turn to share</div><h1 class="page-title">Tell a story</h1>
        <p class="subtle">Start with one thing you actually experienced.</p>
        ${linked ? `<p class="pill space">In response to ${escape(linked.title)}</p>` : ''}
        <form class="form-stack space" id="share-form">
          <div class="writing-panel">
            <label class="field">Title<input name="title" maxlength="100" value="${escape(draft.title)}" placeholder="The one detail that stayed with me" required></label>
            <label class="field">${draft.audio ? 'Transcript' : 'Your story'}<textarea name="text" maxlength="1800" placeholder="What happened? What surprised you?" required>${escape(draft.text)}</textarea></label>
            <div class="writing-toolbar"><label class="field">Circle<select name="circle">${circles.map(circle => `<option value="${circle.id}"${circle.id === draft.circle ? ' selected' : ''}>${circle.topic} · ${escape(circle.title)}</option>`).join('')}</select></label>
            ${recordingControls('story', draft.audio)}</div>
          </div>
          <p class="subtle">You’ll preview your public story and choose which parts AI can quote.</p>
          <button class="primary" type="submit">Preview</button>
        </form>
      </div>`;
    }

    function renderInbox() {
      if (state.role === 'guest') return `<div class="page">${guestPrompt()}</div>`;
      const incoming = state.questions.filter(item => item.author === state.role).slice().reverse();
      const outgoing = state.questions.filter(item => item.asker === state.role).slice().reverse();
      const section = (items, title, empty) => `<section class="section"><div class="section-head"><h2>${title}</h2></div><div class="row-list">
        ${items.length ? items.map(renderInboxItem).join('') : `<div class="empty">${empty}</div>`}</div></section>`;
      return `<div class="page"><div class="eyebrow">Your conversations</div><h1 class="page-title">Inbox</h1><p class="subtle">Follow-ups between you and another person.</p>
        ${section(incoming, 'Questions for you', 'Questions from your stories will land here.')}
        ${section(outgoing, 'Questions you asked', 'Ask an author for a detail to start a conversation.')}
      </div>`;
    }

    function renderInboxItem(item) {
      const other = item.author === state.role ? item.asker : item.author;
      const badge = item.status === 'answered' ? 'Replied' : item.status === 'declined' ? 'Passed' : 'Waiting';
      return `<button class="row-button" data-action="open-thread" data-id="${escape(item.id)}">
        ${avatar(other)}<span class="row-copy"><strong>${escape(item.question)}</strong><span class="subtle">${people[other].first} · ${badge}${item.unread.includes(state.role) ? ' · New' : ''}</span></span>${icon('right', 15)}
      </button>`;
    }

    function renderThread() {
      const item = getQuestion(page.id);
      if (!canOpenQuestion(item)) return renderUnavailable('Conversation unavailable');
      const author = state.role === item.author;
      const story = getStory(item.storyId);
      const name = people[item.author].first;
      return `<div class="page"><div class="eyebrow">${icon('lock', 13)} Private follow-up</div>
        <h1 class="page-title">${escape(item.question)}</h1>
        ${story ? action('open-story', escape(story.title), story.id, 'text-button') : '<p class="subtle">The public story was withdrawn.</p>'}
        <div class="space"><span class="pill ${item.status === 'answered' ? 'human' : 'pending'}">${item.status === 'answered' ? `${name} replied` : item.status === 'declined' ? 'Author passed' : `Waiting for ${name}`}</span></div>
        ${item.status === 'answered' ? renderReply(item) : ''}
        ${item.status === 'pending' && author ? renderReplyForm(item, story) : ''}
        ${item.status === 'pending' && !author ? `<div class="panel space"><p class="subtle">Your question is with ${name}. Their reply will appear here.</p><div class="space">${action('switch-inbox', `Demo: switch to ${name}`, item.author)}</div></div>` : ''}
        ${item.status === 'declined' ? '<p class="subtle space">The storyteller chose to pass on this question.</p>' : ''}
      </div>`;
    }

    function renderReplyForm(item, story) {
      const reply = getReply(item.id);
      return `<form class="form-stack space" id="reply-form">
        <div class="writing-panel"><label class="field">${reply.audio ? 'Transcript' : 'Your answer'}<textarea name="text" maxlength="1500" placeholder="What happened next?" required>${escape(reply.text)}</textarea></label>
        <div class="writing-toolbar">${recordingControls(item.id, reply.audio)}</div></div>
        ${item.storyId === 'solo' ? action('sample-reply', 'Use sample answer', item.id, 'text-button') : ''}
        ${story ? `<label class="check-row"><input name="publish" type="checkbox" ${reply.publish ? 'checked' : ''}><span>Add to story and allow AI to quote this answer</span></label>` : ''}
        <div class="button-row"><button class="primary" type="submit">Review reply</button>${action('confirm-pass', 'Pass', item.id)}</div>
      </form>`;
    }

    function renderReply(item) {
      const followups = item.followups || [];
      const shared = getStory(item.sharedStory);
      return `<section class="section">
        <article class="message" id="human-reply"><div class="byline">${avatar(item.author)}<strong>${people[item.author].first} replied</strong><span class="pill human">Human</span></div>
          <p>${escape(item.reply.text)}</p>${item.reply.audio ? `<audio controls preload="none" src="${escape(item.reply.audio)}" style="width:100%;margin-top:8px" aria-label="Listen to author reply"></audio>` : ''}
        </article>
        ${followups.map(note => `<article class="message"><div class="byline">${avatar(note.author, true)}<strong>${people[note.author].first}</strong></div><p>${escape(note.text)}</p></article>`).join('')}
        <form class="composer ask-form space" id="followup-form">${avatar(state.role, true)}<input name="note" maxlength="500" aria-label="Reply in conversation" placeholder="Keep the conversation going…" required><button class="icon-button send" type="submit" aria-label="Send follow-up">${icon('up', 17)}</button></form>
        ${shared ? `<div class="space">${action('open-story', `Related story · ${escape(shared.title)}`, shared.id, 'story-link')}</div>` : ''}
        ${state.role === item.asker && getStory(item.storyId) ? `<div class="space">${action('share-linked', 'Share your own experience', item.id)}</div>` : ''}
        ${state.role === item.author ? `<div class="space">${action('switch-inbox', `Demo: return as ${people[item.asker].first}`, item.asker)}</div>` : ''}
      </section>`;
    }

    function renderMe() {
      const role = state.role;
      const stories = state.stories.filter(story => story.author === role && !story.withdrawn);
      const followed = state.follows[role] || [];
      return `<div class="page"><div class="eyebrow">Your Backstory</div><h1 class="page-title">${people[role].name}</h1>
        ${action('demo', 'Switch demo identity', '', 'ghost')}
        <section class="section"><div class="section-head"><h2>Following</h2></div>
          ${followed.length ? `<div class="row-list">${followed.map(id => {
            const circle = getCircle(id);
            return `<div class="panel"><div class="section-head"><h2>${escape(circle.title)}</h2>${action('follow', 'Unfollow', id, 'text-button')}</div>${action('circle', 'View circle', id, 'text-button')}</div>`;
          }).join('')}</div>` : '<div class="empty">Follow a circle to find it here again.</div>'}
        </section>
        <section class="section"><div class="section-head"><h2>Your stories</h2></div>
          ${stories.length ? `<div class="row-list">${stories.map(story => `<div class="panel"><h2>${escape(story.title)}</h2><div class="button-row">${action('open-story', 'Open story', story.id)}${action('manage', 'Manage sources', story.id)}</div></div>`).join('')}</div>` : '<div class="empty">Your published stories will appear here.</div>'}
        </section>
      </div>`;
    }

    function renderManage() {
      const story = getStory(page.id);
      if (!story || story.author !== state.role) return renderUnavailable('Source access unavailable');
      return `<div class="page"><div class="eyebrow">Author controls</div><h1 class="page-title">Manage sources</h1>
        <p class="subtle">Choose which parts of your public story AI may quote.</p>
        <form id="source-form" class="form-stack panel space">
          ${story.sources.map((source, index) => `<label class="check-row"><input name="source" type="checkbox" value="${escape(source.id)}" ${source.enabled ? 'checked' : ''}><span><strong>Part ${index + 1}</strong><br>${escape(source.text)}</span></label>`).join('')}
          <button class="primary" type="submit">Save source access</button>
        </form>
        <div class="space">${action('confirm-withdraw', 'Withdraw public story', story.id, 'text-button danger')}</div>
      </div>`;
    }

    function render({ top = false } = {}) {
      stopPlayback();
      const scrollTop = screen.scrollTop;
      const main = ['explore', 'share', 'inbox', 'me'];
      const views = { explore: renderExplore, circle: renderCircle, story: renderStory, share: renderShare, inbox: renderInbox, thread: renderThread, me: renderMe, manage: renderManage };
      const tabs = [{ view: 'explore', icon: 'compass', label: 'Explore' }, { view: 'share', icon: 'plus', label: 'Share' }, { view: 'inbox', icon: 'inbox', label: 'Inbox' }, { view: 'me', icon: 'user', label: 'Me' }];
      const section = { circle: 'explore', story: 'explore', thread: 'inbox', manage: 'me' }[page.view] || page.view;
      const heading = main.includes(page.view)
        ? `<a class="wordmark" href="#explore" data-action="explore"><span class="brand-icon">${icon('brand', 17)}</span>Backstory</a>`
        : action('back', `${icon('back', 17)} ${page.view === 'thread' ? 'Inbox' : page.view === 'manage' ? 'Me' : 'Explore'}`, section, 'back');
      topbar.innerHTML = `${heading}<div class="toolbar"><button type="button" class="demo-button" data-action="demo" aria-label="Demo controls. Viewing as ${roleName()}">Demo ${icon('more', 15)} ${avatar(state.role, true)}</button></div>`;
      screen.innerHTML = views[page.view]();
      navigation.innerHTML = tabs.map(tab => `<button class="nav-button" data-action="${tab.view}" ${section === tab.view ? 'aria-current="page"' : ''}>${icon(tab.icon, 19)}${tab.label}${tab.view === 'inbox' && unreadCount() ? '<span class="nav-dot" aria-label="Unread updates"></span>' : ''}</button>`).join('');
      screen.scrollTop = top ? 0 : scrollTop;
      if (focusChat) {
        screen.querySelector('#story-messages .message:last-child')?.scrollIntoView({ block: 'nearest' });
        focusChat = false;
      }
    }

    function showDialog(title, contents, onConfirm = null) {
      confirmAction = onConfirm;
      dialog.innerHTML = `<div class="dialog-head"><h2 id="dialog-title">${escape(title)}</h2>
        <button type="button" class="close" data-action="close-dialog" aria-label="Close">${icon('close', 16)}</button>
        </div><div class="dialog-content">${contents}</div>`;
      if (!dialog.open) dialog.showModal();
    }

    function confirmation(title, contents, label, callback) {
      showDialog(title, `${contents}<div class="button-row">${action('confirm', label, '', 'primary')}${action('close-dialog', 'Cancel')}</div>`, callback);
    }

    function showDemoControls() {
      showDialog('Demo controls', `<p class="subtle">Profiles and sample threads are fictional. “Human” identifies the role in the conversation. Matching and AI twin replies run locally in this browser.</p>
        <div class="row-list">${Object.entries(people).map(([id, person]) => `<button class="row-button${state.role === id ? ' role-current' : ''}" data-action="switch-role" data-id="${id}">
          ${avatar(id)}<span class="row-copy"><strong>${person.name}</strong><span class="subtle">${person.role || 'Community storyteller'}</span></span>${icon(state.role === id ? 'check' : 'right', 15)}</button>`).join('')}</div>
        <div class="button-row">${action('try-match', 'Try a matching example')}${action('fail-next', 'Simulate one AI error')}</div>
        ${action('confirm-reset', 'Reset demo data', '', 'text-button danger')}`);
    }

    function requireIdentity() {
      if (state.role !== 'guest') return true;
      showDemoControls();
      return false;
    }

    function switchRole(role, inbox = false) {
      if (!people[role]) return;
      if (dialog.open) dialog.close();
      if (recording) finishRecording();
      state.role = role;
      askError = null;
      commentParent = null;
      save();
      if (inbox) navigate('inbox');
      else if (page.view === 'thread' && !canOpenQuestion(getQuestion(page.id))) navigate('inbox');
      else if (page.view === 'manage' && getStory(page.id)?.author !== role) navigate('me');
      else render();
      showToast(`Viewing as ${roleName()}`);
    }

    function findCircles(query, fresh = false) {
      const input = query.trim();
      if (!input) return;
      const request = { input, pending: true, clarify: false, clarified: !fresh && (search.clarify || search.clarified), results: null };
      search = request;
      render();
      setTimeout(() => {
        if (search !== request) return;
        search.pending = false;
        const results = matchCircles(input);
        if (!results.length && tokens(input).length <= 2 && !search.clarified) search.clarify = true;
        else search.results = results.map(circle => circle.id);
        if (page.view === 'explore') render();
      }, 170);
    }

    function askStory(question) {
      const story = getStory(page.id);
      const input = question.trim();
      if (!story || !input) return;
      if (nextAskFails) {
        nextAskFails = false;
        askError = { question: input };
        render();
        screen.querySelector('#ask-form input').focus();
        return;
      }
      askError = null;
      const message = answerQuestion(story, input);
      const key = chatKey(story.id);
      state.chats[key] = [...(state.chats[key] || []), message];
      save();
      focusChat = true;
      render();
    }

    function confirmAsk(id) {
      const story = getStory(page.id);
      const message = story && messagesFor(story.id).find(entry => entry.id === id);
      if (!message?.unanswered.length || story.author === state.role || message.sentId || !requireIdentity()) return;
      const asker = state.role;
      const authorName = people[story.author].first;
      const question = message.unanswered.map(part => part.endsWith('?') ? part : `${part}?`).join(' ');
      confirmation(`Send to ${authorName}?`, `<p class="quote-preview">${escape(question)}</p><p class="subtle">This question will be visible to you and ${authorName}.</p>`, 'Send question', () => {
        if (state.role !== asker || !getStory(story.id) || message.sentId) return;
        const existing = state.questions.find(item => item.storyId === story.id && item.asker === asker && normalize(item.question) === normalize(question));
        if (existing) message.sentId = existing.id;
        else {
          const item = { id: makeId('ask'), storyId: story.id, asker, author: story.author, question, status: 'pending', unread: [story.author] };
          state.questions.push(item);
          message.sentId = item.id;
        }
        save();
        openThread(message.sentId);
      });
    }

    function openThread(id) {
      const item = getQuestion(id);
      if (canOpenQuestion(item)) {
        item.unread = item.unread.filter(role => role !== state.role);
        save();
      }
      navigate('thread', id);
      if (item?.status === 'answered' && canOpenQuestion(item)) screen.querySelector('#human-reply')?.scrollIntoView({ block: 'nearest' });
    }

    function toggleFollow(id) {
      if (!getCircle(id) || !requireIdentity()) return;
      const followed = state.follows[state.role];
      const already = followed.includes(id);
      state.follows[state.role] = already ? followed.filter(circle => circle !== id) : [...followed, id];
      save();
      render();
      showToast(already ? 'Circle unfollowed' : 'Circle followed');
    }

    function previewStory() {
      const draft = getDraft();
      if (recording) return showToast('Stop recording before previewing.');
      if (!draft.title.trim() || !draft.text.trim()) return showToast('Add a title and some story text or a transcript.');
      const role = state.role;
      const paragraphs = draft.text.trim().split(/\n\s*\n/).map(part => part.trim()).filter(Boolean);
      confirmation('Review your story', `<h3>${escape(draft.title.trim())}</h3>${draft.audio ? `<div class="recording"><audio controls preload="metadata" src="${escape(draft.audio)}" aria-label="Preview story audio"></audio></div>` : ''}<p class="subtle">All parts below will be public. Select the parts AI may quote when people ask about this story.</p>
        <div class="checkboxes">${paragraphs.map((part, index) => `<label class="check-row"><input type="checkbox" name="publish-source" value="${index}"><span>${escape(part)}</span></label>`).join('')}</div>`, 'Publish story', () => {
        if (state.role !== role) return;
        const allowed = new Set(Array.from(dialog.querySelectorAll('input[name="publish-source"]:checked'), box => Number(box.value)));
        const story = {
          id: makeId('story'), author: role, title: draft.title.trim(), circleIds: [draft.circle],
          summary: '', created: true, linked: getStory(draft.linked)?.id, audio: draft.audio,
          sources: paragraphs.map((text, index) => ({ id: makeId('source'), enabled: allowed.has(index), text, ...(paragraphs.length === 1 && draft.audio ? { audio: draft.audio } : {}) }))
        };
        state.stories.unshift(story);
        const item = getQuestion(draft.thread);
        if (canOpenQuestion(item) && item.asker === role && story.linked === item.storyId) {
          item.sharedStory = story.id;
          markUnread(item, item.author);
        }
        delete state.drafts[role];
        save();
        navigate('story', story.id);
        showToast('Story published');
      });
    }

    function markUnread(item, role) {
      if (!item.unread.includes(role)) item.unread.push(role);
    }

    function previewReply() {
      const item = getQuestion(page.id);
      if (item?.author !== state.role || item.status !== 'pending') return;
      const reply = getReply(item.id);
      if (recording) return showToast('Stop recording before previewing.');
      if (!reply.text.trim()) return showToast('Add a reply or a transcript first.');
      const publish = Boolean(reply.publish && getStory(item.storyId));
      const note = publish ? 'Your answer will also be public and available for AI to quote. The original question remains private.' : 'Your answer will only be visible to you and the person who asked.';
      confirmation('Review reply', `<p class="quote-preview">${escape(reply.text.trim())}</p>${reply.audio ? `<div class="recording"><audio controls preload="metadata" src="${escape(reply.audio)}" aria-label="Preview reply audio"></audio></div>` : ''}<p class="subtle">${note}</p>`, 'Send reply', () => {
        if (item.author !== state.role || item.status !== 'pending') return;
        item.reply = { text: reply.text.trim(), audio: reply.audio };
        item.status = 'answered';
        const story = getStory(item.storyId);
        if (publish && story) story.sources.push({ id: makeId('source'), enabled: true, addition: true, ...item.reply });
        delete state.replies[item.id];
        markUnread(item, item.asker);
        save();
        render();
        showToast('Reply sent');
      });
    }

    function confirmPass(id) {
      const item = getQuestion(id);
      if (item?.author !== state.role || item.status !== 'pending') return;
      confirmation('Pass on this question?', '<p class="subtle">The person who asked will see that you chose to pass.</p>', 'Pass on question', () => {
        if (item.author !== state.role || item.status !== 'pending') return;
        item.status = 'declined';
        markUnread(item, item.asker);
        delete state.replies[item.id];
        save();
        render();
      });
    }

    function sendFollowup(text) {
      const item = getQuestion(page.id);
      if (!text.trim() || !canOpenQuestion(item) || item.status !== 'answered') return;
      if (!item.followups) item.followups = [];
      item.followups.push({ text: text.trim(), author: state.role });
      markUnread(item, item.author === state.role ? item.asker : item.author);
      save();
      render();
    }

    function changeStoryTab(tab) {
      if (page.view !== 'story' || !['discussion', 'ask'].includes(tab)) return;
      storyTab = tab;
      commentParent = null;
      render();
    }

    function replyToComment(id) {
      const story = getStory(page.id);
      if (!story || !requireIdentity() || !discussionFor(story).some(comment => comment.id === id)) return;
      commentParent = id;
      render();
      screen.querySelector('#comment-form input')?.focus();
    }

    function postComment(text) {
      const story = getStory(page.id);
      if (!story || storyTab !== 'discussion' || !text.trim() || !requireIdentity()) return;
      const parentId = discussionFor(story).some(comment => comment.id === commentParent) ? commentParent : null;
      state.comments.push({ id: makeId('comment'), storyId: story.id, parentId, author: state.role, text: text.trim() });
      commentParent = null;
      save();
      render();
      showToast('Public comment posted');
    }

    function shareLinked(id) {
      const item = getQuestion(id);
      const story = item && getStory(item.storyId);
      if (!canOpenQuestion(item) || state.role !== item.asker || !story) return;
      const draft = getDraft();
      draft.circle = story.circleIds[0];
      draft.linked = story.id;
      draft.thread = item.id;
      save();
      navigate('share');
    }

    function saveSources(form) {
      const story = getStory(page.id);
      if (!story || story.author !== state.role) return;
      const allowed = new Set(new FormData(form).getAll('source'));
      for (const source of story.sources) source.enabled = allowed.has(source.id);
      save();
      navigate('story', story.id);
      showToast('Source access updated');
    }

    function confirmWithdraw(id) {
      const story = getStory(id);
      if (!story || story.author !== state.role) return;
      confirmation('Withdraw this story?', '<p class="subtle">It will disappear from circles and shared links. Existing private follow-ups stay in Inbox.</p>', 'Withdraw story', () => {
        if (story.author !== state.role) return;
        story.withdrawn = true;
        save();
        navigate('story', story.id);
      });
    }

    function copyStoryLink(id) {
      if (!getStory(id)) return;
      const url = new URL(location.href);
      url.hash = `story=${id}`;
      showDialog('Share this story', `<p class="subtle">Open this link in the same demo. Stories created here stay in this browser.</p>
        <label class="field">Story link<input id="story-link" readonly value="${escape(url.href)}"></label>${action('copy-current', 'Copy link', '', 'primary')}`);
    }

    async function copyCurrentLink() {
      const input = dialog.querySelector('#story-link');
      if (!input) return;
      input.select();
      try {
        if (!navigator.clipboard) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(input.value);
      } catch {
        if (!document.execCommand('copy')) return showToast('Select and copy the link from the field.');
      }
      dialog.close();
      showToast('Story link copied');
    }

    function updateAudioButton(button, playing) {
      if (!button?.isConnected) return;
      const symbol = button.querySelector('svg');
      if (symbol) symbol.outerHTML = icon(playing ? 'pause' : 'play', 15);
      button.setAttribute('aria-label', playing ? 'Pause audio' : 'Play audio');
    }

    function stopPlayback() {
      if (!activeAudio) return;
      activeAudio.player.pause();
      updateAudioButton(activeAudio.button, false);
      activeAudio = null;
    }

    async function playAudio(url, key, button, start = 0, end = null) {
      if (activeAudio?.key === key && !activeAudio.player.paused) {
        activeAudio.player.pause();
        updateAudioButton(button, false);
        return;
      }
      if (activeAudio?.key !== key) {
        stopPlayback();
        const player = new Audio(url);
        activeAudio = { player, key, button };
        player.addEventListener('ended', () => { if (activeAudio?.player === player) stopPlayback(); });
        player.addEventListener('timeupdate', () => {
          if (end !== null && player.currentTime >= end && activeAudio?.player === player) stopPlayback();
        });
        if (start) player.currentTime = start;
      }
      const current = activeAudio;
      try {
        await current.player.play();
        if (activeAudio === current) updateAudioButton(button, true);
      } catch {
        if (activeAudio === current) {
          stopPlayback();
          showToast('Audio couldn’t play. The transcript is still available.');
        }
      }
    }

    function playStory(id, button) {
      const story = getStory(id);
      const url = id === 'solo' ? audioData : story?.audio;
      if (url && story) playAudio(url, id, button);
    }

    function playSource(id, button) {
      const story = getStory(page.id);
      const source = story?.sources.find(entry => entry.id === id && entry.enabled);
      if (!source) return;
      if (source.clip !== undefined) playAudio(audioData, id, button, sampleClipTimes[source.clip], sampleClipTimes[source.clip + 1]);
      else if (source.audio) playAudio(source.audio, id, button);
    }

    function recordingTarget(target, role) {
      if (target === 'story') return state.drafts[role];
      const item = getQuestion(target);
      if (item?.author === role && item.status === 'pending') return state.replies[target];
      return null;
    }

    function setRecordingMessage(message) {
      recordingMessage = message;
      if (page.view === 'share' || page.view === 'thread') render();
    }

    async function startRecording(target) {
      if (recording || !recordingTarget(target, state.role)) return;
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return setRecordingMessage('Audio recording is unavailable here. You can still write your story or answer.');
      const role = state.role;
      const openedPage = page;
      const session = { target, role, recorder: null, stream: null, timer: null, discarded: false };
      recording = session;
      setRecordingMessage('Waiting for microphone permission…');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        session.stream = stream;
        if (recording !== session || page !== openedPage || state.role !== role) {
          stream.getTracks().forEach(track => track.stop());
          return;
        }
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        session.recorder = recorder;
        recorder.addEventListener('dataavailable', event => { if (event.data.size) chunks.push(event.data); });
        recorder.addEventListener('stop', () => {
          stream.getTracks().forEach(track => track.stop());
          if (session.discarded) return;
          const audio = new Blob(chunks, { type: recorder.mimeType });
          if (!audio.size || audio.size > 1000000) return setRecordingMessage('That recording couldn’t be saved. Try a shorter clip or use text.');
          const reader = new FileReader();
          reader.onload = () => {
            const draft = recordingTarget(target, role);
            if (!draft || session.discarded) return;
            draft.audio = String(reader.result);
            save();
            if (state.role === role && page === openedPage) setRecordingMessage('Recording ready. Add or check the transcript below.');
          };
          reader.readAsDataURL(audio);
        });
        recorder.start();
        session.timer = setTimeout(finishRecording, 30000);
        setRecordingMessage('Recording… Up to 30 seconds.');
      } catch {
        session.stream?.getTracks().forEach(track => track.stop());
        if (recording !== session) return;
        recording = null;
        setRecordingMessage('Microphone unavailable. You can still write your story or answer.');
      }
    }

    function finishRecording() {
      if (!recording) return;
      const session = recording;
      recording = null;
      clearTimeout(session.timer);
      if (session.recorder?.state === 'recording') session.recorder.stop();
      else session.discarded = true;
      setRecordingMessage('');
    }

    function resetDemo() {
      if (recording) {
        recording.discarded = true;
        finishRecording();
      }
      state = freshState();
      search = { input: '', pending: false, clarify: false, results: null };
      askError = null;
      storyTab = 'discussion';
      nextAskFails = false;
      save();
      navigate('explore', null, true);
      showToast('Demo reset');
    }

    const handlers = {
      explore: () => navigate('explore'), share: () => navigate('share'), inbox: () => navigate('inbox'), me: () => navigate('me'),
      back: id => navigate(id), circle: id => navigate('circle', id),
      'open-story': id => { askError = null; navigate('story', id); },
      'open-thread': openThread, manage: id => navigate('manage', id), follow: toggleFollow,
      demo: showDemoControls, 'switch-role': id => switchRole(id), 'switch-inbox': id => switchRole(id, true),
      'close-dialog': () => dialog.close(),
      'try-match': () => { if (dialog.open) dialog.close(); navigate('explore'); findCircles(starterPrompt, true); },
      'fail-next': () => { nextAskFails = true; dialog.close(); showToast('The next story question will show the retry state.'); },
      'confirm-reset': () => confirmation('Reset the demo?', '<p class="subtle">This clears local stories, follows, and conversations from this demo.</p>', 'Reset demo', resetDemo),
      confirm: () => { const run = confirmAction; confirmAction = null; dialog.close(); run?.(); },
      prompt: (id, button) => askStory(button.textContent), 'confirm-ask': confirmAsk, 'confirm-pass': confirmPass,
      'sample-reply': id => { if (getQuestion(id)?.author === state.role) { getReply(id).text = starterReply; save(); render(); } },
      'share-circle': id => { if (getCircle(id) && requireIdentity()) { getDraft().circle = id; save(); navigate('share'); } },
      'share-linked': shareLinked, 'confirm-withdraw': confirmWithdraw,
      'copy-link': copyStoryLink, 'copy-current': copyCurrentLink,
      'play-story': playStory, 'play-source': playSource,
      'story-tab': changeStoryTab, 'comment-reply': replyToComment,
      'cancel-comment-reply': () => { commentParent = null; render(); },
      record: startRecording, 'stop-recording': finishRecording,
      'remove-audio': id => {
        const draft = recordingTarget(id, state.role);
        if (draft) { draft.audio = ''; save(); setRecordingMessage(''); }
      }
    };

    document.addEventListener('click', event => {
      const control = event.target.closest('[data-action]');
      if (!control) return;
      const handler = handlers[control.dataset.action];
      if (handler) {
        event.preventDefault();
        handler(control.dataset.id, control);
      }
    });

    document.addEventListener('submit', event => {
      const form = event.target;
      event.preventDefault();
      const values = new FormData(form);
      switch (form.id) {
        case 'find-form': findCircles(String(values.get('query'))); break;
        case 'ask-form': askStory(String(values.get('question'))); break;
        case 'share-form': previewStory(); break;
        case 'reply-form': previewReply(); break;
        case 'followup-form': sendFollowup(String(values.get('note'))); break;
        case 'comment-form': postComment(String(values.get('comment'))); break;
        case 'source-form': saveSources(form); break;
      }
    });

    document.addEventListener('input', event => {
      const field = event.target;
      if (field.form?.id === 'share-form' && ['title', 'circle', 'text'].includes(field.name)) {
        getDraft()[field.name] = field.value;
        save();
      } else if (field.form?.id === 'reply-form' && ['text', 'publish'].includes(field.name)) {
        getReply(page.id)[field.name] = field.type === 'checkbox' ? field.checked : field.value;
        save();
      } else if (field.form?.id === 'find-form') search.input = field.value;
    });

    window.addEventListener('hashchange', () => {
      const destination = readPage();
      if (destination.view === page.view && destination.id === page.id) return;
      askError = null;
      if (recording) finishRecording();
      storyTab = 'discussion';
      commentParent = null;
      page = destination;
      if (page.view === 'thread') openThread(page.id);
      else render({ top: true });
    });

    document.querySelectorAll('[data-icon]').forEach(node => { node.innerHTML = icon(node.dataset.icon, 17); });
    if (page.view === 'thread') openThread(page.id);
    else render({ top: true });
  </script>
</body>
</html>
